name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build-and-release:
    name: Build artifacts & create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Build Anchor program
        run: anchor build

      - name: Package release artifacts
        run: |
          mkdir -p release-artifacts/idl
          mkdir -p release-artifacts/types
          mkdir -p release-artifacts/deploy
          cp target/idl/*.json release-artifacts/idl/ 2>/dev/null || true
          cp target/types/*.ts release-artifacts/types/ 2>/dev/null || true
          cp target/deploy/*.so release-artifacts/deploy/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*
